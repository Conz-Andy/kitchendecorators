name: Deploy to live site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files to Namecheap (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server270.web-hosting.com
          username: github-deploy@kitchendecorators.co.uk
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            image-urls.txt
