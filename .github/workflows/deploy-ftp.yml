# Publishes the site to the Namecheap hosting every time `main` changes
# (i.e. whenever a pull request is merged), so no manual uploads are needed.
#
# One-time setup — add these in GitHub: repo Settings > Secrets and variables
# > Actions > New repository secret:
#   FTP_SERVER    the FTP host from cPanel (e.g. ftp.kitchendecorators.co.uk
#                 or the server name shown in cPanel > FTP Accounts)
#   FTP_USERNAME  the FTP account's full username (e.g. deploy@kitchendecorators.co.uk)
#   FTP_PASSWORD  that FTP account's password
#
# The FTP account should be created in cPanel > FTP Accounts with its
# directory set to public_html, so it can only reach the website files.
#
# Only files that changed are uploaded (the action keeps a small
# .ftp-deploy-sync-state.json file on the server to track this).
# Nothing on the server is deleted.

name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # the FTP account already starts in public_html
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            image-urls.txt
            review.html
            reel/**
            branding-pack/**

      - name: Check the live site
        run: |
          sleep 10
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" "$1")
            echo "$code  $1"
            [ "$code" = "$2" ] || fail=1
          }
          check https://www.kitchendecorators.co.uk/ 200
          check https://www.kitchendecorators.co.uk/about/ 200
          check https://www.kitchendecorators.co.uk/kitchen-respray-winchester/ 200
          check https://www.kitchendecorators.co.uk/blog/ 200
          check https://www.kitchendecorators.co.uk/styles.css 200
          check https://www.kitchendecorators.co.uk/about.html 301
          if curl -s https://www.kitchendecorators.co.uk/ | grep -q 'content="noindex'; then
            echo "Homepage still has noindex"; fail=1
          fi
          exit $fail
