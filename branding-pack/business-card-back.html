<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Business card — back (85 × 55 mm) — The Kitchen Decorating Co</title>
<link rel="icon" type="image/svg+xml" href="../images/kdc-logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="bp.css">
<style>
body{margin:0;font-family:'Figtree','Helvetica Neue',sans-serif;color:#ffffff;background:#2F3191}
@page{size:321px 208px;margin:0}
</style>
<script src="bp.js"></script>
</head>
<body>
<div class="bp-bar"><a href="./">&larr; Branding pack</a><span>Business card — back (85 × 55 mm)</span><button type="button" onclick="window.print()">Save as PDF / Print</button></div>
<div class="bp-stage">
<div style="width: 321px; height: 208px; box-sizing: border-box; background: #2F3191; padding: 20px 20px 18px 22px; display: flex; gap: 14px; color: #ffffff">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 17px; line-height: 1.1">Scott [Surname]</div>
<div style="font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9fe6e2">[Job title]</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; line-height: 1.25">
<div style="font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 15px">01962 458055</div>
<div style="font-weight: 500">[email]@kitchendecorators.co.uk</div>
<div style="font-weight: 600">kitchendecorators.co.uk</div>
<div style="font-weight: 400; color: #d9daf2">Unit 4A, Bridge Farm Industries,<br>Botley Rd, Curbridge SO30 2HB</div>
</div>
</div>
<div style="width: 84px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center">
<div style="width: 78px; height: 78px; background: #ffffff; border-radius: 6px; padding: 3px; box-sizing: border-box">
<img src="review-qr.svg" alt="QR code to leave a Google review" style="width: 72px; height: 72px; display: block">
</div>
<div style="font-size: 9.5px; font-weight: 700; line-height: 1.2">Scan to leave<br>a review</div>
<div style="font-size: 9.5px; font-weight: 500; line-height: 1.2; color: #d9daf2"><span style="color: #ffd166">★★★★★</span><br>5.0 on Google</div>
</div>
</div>
</div>
</body>
</html>
