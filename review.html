<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Change Review — Kitchen Decorators</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; background: #1e1e1e; }
  #frame { flex: 1; border: 0; height: 100vh; background: #fff; }
  #panel {
    width: 330px; flex-shrink: 0; height: 100vh; overflow-y: auto;
    background: #1e1e1e; color: #e8e2d5; padding: 20px 18px; font-size: 13px;
  }
  #panel h1 { font-size: 15px; letter-spacing: 0.06em; margin-bottom: 4px; color: #fff; }
  #panel .sub { color: #9a927f; font-size: 11.5px; margin-bottom: 14px; }
  .pages { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .pages button {
    background: #333; color: #ddd; border: 0; padding: 6px 10px; font-size: 11px;
    cursor: pointer; border-radius: 3px;
  }
  .pages button.active { background: #8c6e3f; color: #fff; }
  .item {
    background: #2a2822; border-left: 3px solid #d9a94a; border-radius: 3px;
    padding: 10px 12px; margin-bottom: 10px; cursor: pointer;
  }
  .item:hover { background: #33302a; }
  .item .num {
    display: inline-flex; width: 20px; height: 20px; border-radius: 50%;
    background: #d9a94a; color: #1e1e1e; font-weight: 700; font-size: 11px;
    align-items: center; justify-content: center; margin-right: 8px;
  }
  .item .title { font-weight: 600; color: #fff; font-size: 12.5px; }
  .item .scott { color: #b8ae99; font-style: italic; font-size: 11.5px; margin-top: 5px; line-height: 1.5; }
  .item .done { color: #8fbf8f; font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
  .item.missing { opacity: 0.35; cursor: default; }
  .note { color: #9a927f; font-size: 11px; margin-top: 14px; line-height: 1.6; border-top: 1px solid #3a372f; padding-top: 12px; }
</style>
</head>
<body>

<iframe id="frame" src="index.html"></iframe>

<div id="panel">
  <h1>Round 2 Changes — Cross-Check</h1>
  <div class="sub">Click an item to jump to it. Gold outlines mark the change on the page. This overlay is for Andrew only — the normal site link shows none of this.</div>
  <div class="pages" id="pagebtns"></div>
  <div id="items"></div>
  <div class="note">When you're happy, tell Claude "remove the review overlay" — it's one file (review.html), the site pages are untouched.</div>
</div>

<script>
const PAGES = ['index.html','gallery.html','reviews.html','kitchen-resprays.html','about.html','faqs.html','contact.html','quote.html','service-areas.html'];

const CHANGES = [
  { num: 1, page: 'index.html', sel: '.brand',
    title: 'Logo restored', scott: '"Home page - Logo is missing"',
    done: 'Original website logo restored on every page (per Andrew).' },
  { num: 2, page: 'index.html', sel: '.brand-row',
    title: 'Colour links now work', scott: '"Explore colour options - the tab doesn’t seem to work"',
    done: 'The four brand chips now open the real colour charts: Dulux, Farrow & Ball, Little Greene, Edward Bulmer (new tab).' },
  { num: 3, page: 'index.html', sel: '.beforeafter .ba-grid',
    title: 'Click to enlarge', scott: '"when you click on the picture shouldn’t it enlarge? and ditto with the gallery"',
    done: 'Every photo (transformations, gallery tiles, gallery page) opens full-screen on click. Esc or click closes.' },
  { num: 4, page: 'index.html', sel: '.gallery-grid',
    title: 'Towns mixed up', scott: '"all mention Southampton. Can you mix it up a bit"',
    done: 'Captions now spread across Winchester, Romsey, Chandler’s Ford, Hedge End, Colden Common, Botley, Salisbury, Basingstoke.' },
  { num: 5, page: 'about.html', sel: '.page-hero',
    title: 'About heading', scott: '"under the heading please add - Dulux Accredited etc"',
    done: '"Dulux Accredited Kitchen Sprayer" added directly under the About Us heading.' },
  { num: 6, page: 'faqs.html', sel: '.faq-item:nth-child(2)',
    title: 'FAQ: surfaces', scott: '"we dont offer test patches and we do spray MDF"',
    done: 'Test patches removed; MDF now listed as sprayable.' },
  { num: 7, page: 'faqs.html', sel: '.faq-item:nth-child(3)',
    title: 'FAQ: paints', scott: '"we use a specialist paint designed for kitchen that match to all the brands you mentioned"',
    done: 'Now: specialist kitchen paint, colour matched to Dulux, F&B, Little Greene and Edward Bulmer.' },
  { num: 8, page: 'faqs.html', sel: '.faq-item:nth-child(4)',
    title: 'FAQ: process', scott: '"its only 2 afternoons"',
    done: 'Now: "Our time in your home is just 2 afternoons."' },
  { num: 9, page: 'faqs.html', sel: '.faq-item:nth-child(6)',
    title: 'FAQ: fixtures', scott: '"dont mention rollers"',
    done: 'Rollers removed - masked and sprayed in place.' },
  { num: 10, page: 'faqs.html', sel: '.faq-item:nth-child(8)',
    title: 'FAQ: same day use', scott: '"you can use your kitchen the same day"',
    done: 'Now: "You can use your kitchen the same day."' },
  { num: 11, page: 'faqs.html', sel: '.faq-item:nth-child(9)',
    title: 'FAQ: damage remedy', scott: '"we will always return to remedy any damage free of charge unless you are a serial offender then we charge!"',
    done: 'Added word for word (joke included).' },
  { num: 12, page: 'gallery.html', sel: '.pairs-grid',
    title: 'Gallery: towns + enlarge', scott: '"mix it up a bit... ditto with the gallery"',
    done: 'All 11 project captions now varied towns; every photo enlarges on click.' },
  { num: 13, page: 'index.html', sel: '.site-footer .footer-grid',
    title: 'Service area links', scott: '"i see services areas link on the footer but no content"',
    done: 'New Service Areas page created listing all the towns; footer links now go there.' },
];

const frame = document.getElementById('frame');
const itemsEl = document.getElementById('items');
const btnsEl = document.getElementById('pagebtns');

PAGES.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.replace('.html','');
  b.onclick = () => { frame.src = p; };
  b.dataset.page = p;
  btnsEl.appendChild(b);
});

function currentPage() {
  try { return frame.contentWindow.location.pathname.split('/').pop() || 'index.html'; }
  catch (e) { return 'index.html'; }
}

function inject() {
  let doc;
  try { doc = frame.contentDocument; } catch (e) { return; }
  if (!doc || !doc.body) return;
  const page = currentPage();

  // page buttons state
  btnsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === page));

  // highlight relevant elements
  CHANGES.filter(c => c.page === page).forEach(c => {
    const el = doc.querySelector(c.sel);
    if (!el || el.dataset.rv) return;
    el.dataset.rv = '1';
    el.style.outline = '3px dashed #d9a94a';
    el.style.outlineOffset = '6px';
    el.style.position = el.style.position || 'relative';
    const badge = doc.createElement('div');
    badge.textContent = c.num;
    badge.style.cssText = 'position:absolute;top:-14px;left:-14px;width:28px;height:28px;border-radius:50%;background:#d9a94a;color:#1e1e1e;font:700 14px/28px sans-serif;text-align:center;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.4);';
    el.appendChild(badge);
  });

  // sidebar list
  itemsEl.innerHTML = '';
  CHANGES.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.page === page ? '' : ' missing');
    d.innerHTML = '<span class="num">' + c.num + '</span><span class="title">' + c.title + '</span>'
      + '<div class="scott">Scott: ' + c.scott + '</div>'
      + '<div class="done">&#10003; ' + c.done + '</div>'
      + (c.page === page ? '' : '<div class="scott" style="font-style:normal;">(on ' + c.page.replace('.html','') + ' — click to open)</div>');
    d.onclick = () => {
      if (c.page !== page) { frame.src = c.page + '#'; return; }
      const el = frame.contentDocument && frame.contentDocument.querySelector(c.sel);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    itemsEl.appendChild(d);
  });
}

frame.addEventListener('load', () => setTimeout(inject, 300));
</script>

</body>
</html>
